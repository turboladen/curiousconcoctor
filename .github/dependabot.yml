# Opens pull requests when the actions pinned in .github/workflows/ publish new releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has a week to be caught and yanked before Dependabot proposes it.
    cooldown:
      default-days: 7
    # All action updates arrive together in one pull request per week.
    groups:
      actions:
        patterns: ["*"]
