{% extends "index.html" %} {% block content %}
{% set count = term.pages | length %}
<h1 class="title">Drink type: {{ term.name }}</h1>
<p class="term-count">{{ count }} {% if count == 1 %}post{% else %}posts{% endif %}</p>
<ul>
  {% for post in term.pages %}{{<post_in_list post={post} />}}{% endfor %}
</ul>
{% endblock content %}
